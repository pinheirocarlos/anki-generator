<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" width="100%" height="auto">
  <rect width="680" height="320" fill="#090d16" rx="12"/>
  
  <!-- Title -->
  <text x="340" y="28" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">TLS 1.3 Handshake (1-RTT) vs TLS 1.2 Legado (2-RTT)</text>
  
  <!-- Client Column -->
  <rect x="70" y="45" width="160" height="35" rx="6" fill="#1e3a8a" stroke="#3b82f6"/>
  <text x="150" y="67" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Navegador / Cliente</text>
  <line x1="150" y1="80" x2="150" y2="300" stroke="#3b82f6" stroke-width="2" stroke-dasharray="4"/>

  <!-- Server Column -->
  <rect x="450" y="45" width="160" height="35" rx="6" fill="#065f46" stroke="#10b981"/>
  <text x="530" y="67" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Servidor Seguro</text>
  <line x1="530" y1="80" x2="530" y2="300" stroke="#10b981" stroke-width="2" stroke-dasharray="4"/>

  <!-- Step 1: ClientHello + KeyShare -->
  <path d="M 150 115 L 530 150" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="180" y="105" width="320" height="26" rx="4" fill="#0f172a" stroke="#38bdf8"/>
  <text x="340" y="122" fill="#38bdf8" font-family="-apple-system, monospace" font-size="10" font-weight="bold" text-anchor="middle">1. ClientHello + KeyShare (ECDHE) + ALPN (h2)</text>
  <text x="70" y="120" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10">0.5 RTT</text>

  <!-- Step 2: ServerHello + Cert -->
  <path d="M 530 175 L 150 210" stroke="#a78bfa" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="180" y="170" width="320" height="26" rx="4" fill="#0f172a" stroke="#a78bfa"/>
  <text x="340" y="187" fill="#c4b5fd" font-family="-apple-system, monospace" font-size="10" font-weight="bold" text-anchor="middle">2. ServerHello + KeyShare + Certificado Cifrado</text>
  <text x="545" y="180" fill="#a78bfa" font-family="-apple-system, sans-serif" font-size="10" font-weight="bold">1.0 RTT (Pronto!)</text>

  <!-- Step 3: Application Data Encrypted -->
  <path d="M 150 240 L 530 270" stroke="#22c55e" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="190" y="235" width="300" height="26" rx="4" fill="#064e3b" stroke="#22c55e"/>
  <text x="340" y="252" fill="#4ade80" font-family="-apple-system, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">🔒 Dados da Aplicação (HTTP/2 Cifrado)</text>

  <!-- Bottom Comparison Tag -->
  <rect x="80" y="280" width="520" height="28" rx="4" fill="#1e293b" stroke="#64748b"/>
  <text x="340" y="298" fill="#fde047" font-family="-apple-system, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">⚡ TLS 1.3 economiza 1 RTT completo vs TLS 1.2 ao embutir chaves no primeiro pacote</text>
</svg>

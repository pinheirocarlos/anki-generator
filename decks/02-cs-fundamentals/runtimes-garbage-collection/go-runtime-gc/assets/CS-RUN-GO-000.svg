<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" width="100%" height="auto">
  <rect width="680" height="320" fill="#090d16" rx="12"/>
  
  <!-- Title -->
  <text x="340" y="28" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">Go Runtime Scheduler: O Modelo GMP &amp; Work Stealing</text>
  
  <!-- Global Run Queue -->
  <rect x="230" y="45" width="220" height="42" rx="6" fill="#1e293b" stroke="#64748b" stroke-dasharray="4"/>
  <text x="340" y="65" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Global Run Queue (GRQ)</text>
  <text x="340" y="80" fill="#cbd5e1" font-family="-apple-system, monospace" font-size="10" text-anchor="middle">[G5] [G6] [G7] ...</text>

  <!-- Left Column: Core 0 (P0 + M0) -->
  <rect x="40" y="105" width="270" height="195" rx="8" fill="#111827" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="175" y="125" fill="#93c5fd" font-family="-apple-system, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">CPU Core 0 (Logical P0)</text>
  
  <!-- P0 Local Run Queue -->
  <rect x="55" y="135" width="240" height="40" rx="4" fill="#1e293b"/>
  <text x="175" y="152" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Local Run Queue (LRQ)</text>
  <text x="175" y="167" fill="#f8fafc" font-family="-apple-system, monospace" font-size="10" text-anchor="middle">[G1 (rodando)] [G2] [G3]</text>

  <!-- M0 (OS Thread) -->
  <rect x="55" y="185" width="240" height="45" rx="4" fill="#1e3a8a"/>
  <text x="175" y="204" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">M0 (Thread de OS Ativa)</text>
  <text x="175" y="220" fill="#93c5fd" font-family="-apple-system, sans-serif" font-size="10" text-anchor="middle">Executando G1 no espaço de usuário</text>

  <!-- Right Column: Core 1 (P1 + M1 - Work Stealing) -->
  <rect x="370" y="105" width="270" height="195" rx="8" fill="#111827" stroke="#10b981" stroke-width="1.5"/>
  <text x="505" y="125" fill="#6ee7b7" font-family="-apple-system, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">CPU Core 1 (Logical P1)</text>

  <!-- P1 Local Run Queue (Empty) -->
  <rect x="385" y="135" width="240" height="40" rx="4" fill="#1e293b"/>
  <text x="505" y="152" fill="#34d399" font-family="-apple-system, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">LRQ Vazia (Fila Esgotada)</text>
  <text x="505" y="167" fill="#94a3b8" font-family="-apple-system, monospace" font-size="10" text-anchor="middle">[ ]</text>

  <!-- M1 (OS Thread) Stealing -->
  <rect x="385" y="185" width="240" height="45" rx="4" fill="#064e3b"/>
  <text x="505" y="204" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">M1 (Thread de OS Ativa)</text>
  <text x="505" y="220" fill="#a7f3d0" font-family="-apple-system, sans-serif" font-size="10" text-anchor="middle">Rouba 50% das Goroutines de P0</text>

  <!-- Work Stealing Curved Arrow -->
  <path d="M 385 155 Q 340 130 295 155" fill="none" stroke="#fbbf24" stroke-width="2.5" stroke-dasharray="4"/>
  <text x="340" y="135" fill="#fde047" font-family="-apple-system, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">⚡ Work Stealing</text>

  <!-- Bottom Badge: Network Poller -->
  <rect x="180" y="260" width="320" height="30" rx="6" fill="#1e293b" stroke="#334155"/>
  <text x="340" y="280" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Network Poller (epoll) gerencia I/O sem bloquear M</text>
</svg>

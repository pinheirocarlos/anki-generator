<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 250" width="100%" height="auto">
  <rect width="620" height="250" fill="#0f172a" rx="12"/>
  
  <text x="310" y="28" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Tradução de Endereço Virtual via TLB e Page Table (MMU)</text>

  <!-- Virtual Address Box -->
  <rect x="30" y="55" width="140" height="60" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="100" y="78" fill="#93c5fd" font-family="-apple-system, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Endereço Virtual (VA)</text>
  <text x="100" y="98" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="10" text-anchor="middle">VPN | Offset</text>

  <!-- TLB Box -->
  <rect x="220" y="55" width="170" height="70" rx="8" fill="#1e293b" stroke="#22c55e" stroke-width="2"/>
  <text x="305" y="80" fill="#86efac" font-family="-apple-system, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">TLB (Hardware Cache)</text>
  <text x="305" y="102" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="10" text-anchor="middle">Latência: ~0.5 - 1 ns</text>

  <!-- Page Table (DRAM) -->
  <rect x="220" y="160" width="170" height="65" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="305" y="185" fill="#fcd34d" font-family="-apple-system, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Page Table (na DRAM)</text>
  <text x="305" y="205" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="10" text-anchor="middle">Page Walk: ~50 - 100 ns</text>

  <!-- Physical Memory Box -->
  <rect x="440" y="90" width="150" height="85" rx="8" fill="#1e293b" stroke="#a855f7" stroke-width="2"/>
  <text x="515" y="118" fill="#d8b4fe" font-family="-apple-system, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Memória Física (RAM)</text>
  <text x="515" y="140" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="10" text-anchor="middle">Physical Frame Address</text>
  <text x="515" y="158" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="9" text-anchor="middle">Frame Number + Offset</text>

  <!-- Paths -->
  <!-- VA to TLB -->
  <path d="M 170 85 L 220 85" stroke="#38bdf8" stroke-width="2"/>
  <!-- TLB Hit to RAM -->
  <path d="M 390 85 L 440 120" stroke="#22c55e" stroke-width="2"/>
  <text x="408" y="95" fill="#86efac" font-family="-apple-system, sans-serif" font-size="9" font-weight="bold">Hit</text>
  <!-- TLB Miss to Page Table -->
  <path d="M 305 125 L 305 160" stroke="#ef4444" stroke-width="2"/>
  <text x="312" y="145" fill="#f87171" font-family="-apple-system, sans-serif" font-size="9" font-weight="bold">Miss</text>
  <!-- Page Table to RAM -->
  <path d="M 390 190 L 440 155" stroke="#f59e0b" stroke-width="2"/>
</svg>

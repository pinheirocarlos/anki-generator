<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" width="100%" height="auto">
  <rect width="680" height="320" fill="#090d16" rx="12"/>
  
  <!-- Title -->
  <text x="340" y="28" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">TCP 3-Way Handshake &amp; Máquina de Estados</text>
  
  <!-- Client Column -->
  <rect x="70" y="45" width="160" height="35" rx="6" fill="#1e3a8a" stroke="#3b82f6"/>
  <text x="150" y="67" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Cliente TCP</text>
  <line x1="150" y1="80" x2="150" y2="300" stroke="#3b82f6" stroke-width="2" stroke-dasharray="4"/>

  <!-- Server Column -->
  <rect x="450" y="45" width="160" height="35" rx="6" fill="#065f46" stroke="#10b981"/>
  <text x="530" y="67" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Servidor TCP (LISTEN)</text>
  <line x1="530" y1="80" x2="530" y2="300" stroke="#10b981" stroke-width="2" stroke-dasharray="4"/>

  <!-- Message 1: SYN -->
  <path d="M 150 110 L 530 145" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="235" y="102" width="210" height="24" rx="4" fill="#0f172a" stroke="#38bdf8"/>
  <text x="340" y="118" fill="#38bdf8" font-family="-apple-system, monospace" font-size="11" font-weight="bold" text-anchor="middle">1. SYN (seq = X)</text>
  <text x="60" y="115" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10">SYN_SENT</text>

  <!-- Message 2: SYN-ACK -->
  <path d="M 530 165 L 150 200" stroke="#a78bfa" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="210" y="160" width="260" height="24" rx="4" fill="#0f172a" stroke="#a78bfa"/>
  <text x="340" y="176" fill="#c4b5fd" font-family="-apple-system, monospace" font-size="11" font-weight="bold" text-anchor="middle">2. SYN-ACK (seq = Y, ack = X+1)</text>
  <text x="545" y="165" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10">SYN_RCVD</text>

  <!-- Message 3: ACK -->
  <path d="M 150 220 L 530 255" stroke="#34d399" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="235" y="215" width="210" height="24" rx="4" fill="#0f172a" stroke="#34d399"/>
  <text x="340" y="231" fill="#6ee7b7" font-family="-apple-system, monospace" font-size="11" font-weight="bold" text-anchor="middle">3. ACK (ack = Y+1)</text>
  <text x="50" y="235" fill="#4ade80" font-family="-apple-system, sans-serif" font-size="10" font-weight="bold">ESTABLISHED</text>
  <text x="545" y="260" fill="#4ade80" font-family="-apple-system, sans-serif" font-size="10" font-weight="bold">ESTABLISHED</text>

  <!-- Data Flow Box -->
  <rect x="180" y="270" width="320" height="30" rx="6" fill="#1e293b" stroke="#64748b"/>
  <text x="340" y="290" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">🔒 Conexão Aberta: Início do Tráfego de Dados</text>
</svg>

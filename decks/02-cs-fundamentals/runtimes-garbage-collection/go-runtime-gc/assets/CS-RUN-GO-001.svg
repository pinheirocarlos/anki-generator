<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" width="100%" height="auto">
  <rect width="680" height="300" fill="#090d16" rx="12"/>
  
  <!-- Title -->
  <text x="340" y="26" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Algoritmo Tri-Color Mark &amp; Sweep e Write Barrier no Go</text>
  
  <!-- Roots Box -->
  <rect x="40" y="55" width="140" height="50" rx="6" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="110" y="78" fill="#93c5fd" font-family="-apple-system, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">GC Roots</text>
  <text x="110" y="93" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="10" text-anchor="middle">(Stacks, Globais)</text>

  <!-- Black Node (Scanned) -->
  <circle cx="270" cy="80" r="30" fill="#0f172a" stroke="#22c55e" stroke-width="2.5"/>
  <text x="270" y="77" fill="#4ade80" font-family="-apple-system, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">PRETO</text>
  <text x="270" y="92" fill="#86efac" font-family="-apple-system, sans-serif" font-size="9" text-anchor="middle">100% Escaneado</text>

  <!-- Grey Node (Scanning in progress) -->
  <circle cx="430" cy="80" r="30" fill="#334155" stroke="#f59e0b" stroke-width="2.5"/>
  <text x="430" y="77" fill="#fbbf24" font-family="-apple-system, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">CINZA</text>
  <text x="430" y="92" fill="#fde68a" font-family="-apple-system, sans-serif" font-size="9" text-anchor="middle">Na Fila do GC</text>

  <!-- White Node (Unreachable / Candidate to sweep) -->
  <circle cx="590" cy="80" r="30" fill="#1e293b" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3"/>
  <text x="590" y="77" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">BRANCO</text>
  <text x="590" y="92" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="9" text-anchor="middle">Candidato a Lixo</text>

  <!-- Arrows -->
  <path d="M 180 80 L 240 80" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 300 80 L 400 80" stroke="#22c55e" stroke-width="2"/>
  <path d="M 460 80 L 560 80" stroke="#f59e0b" stroke-width="2" stroke-dasharray="3"/>

  <!-- Write Barrier Box (Bottom) -->
  <rect x="40" y="160" width="600" height="115" rx="8" fill="#111827" stroke="#ef4444" stroke-width="1.5"/>
  <text x="340" y="185" fill="#f87171" font-family="-apple-system, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">🛡️ Como a Write Barrier Salva Dados Vivos da Coleta Acidental</text>
  
  <text x="60" y="210" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="11">
    1. Goroutine mutadora cria novo ponteiro: <tspan fill="#4ade80" font-weight="bold">Objeto Preto</tspan> ➔ <tspan fill="#f8fafc" font-weight="bold">Objeto Branco</tspan>
  </text>
  <text x="60" y="230" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="11">
    2. Goroutine desconecta o ponteiro do <tspan fill="#fbbf24" font-weight="bold">Objeto Cinza</tspan> antes do GC visitá-lo.
  </text>
  <text x="60" y="255" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="11" font-weight="bold">
    ⚡ Ação da Write Barrier: Intercepta a escrita e pinta o Objeto Branco de CINZA imediatamente!
  </text>
</svg>

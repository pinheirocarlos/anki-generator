<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" width="100%" height="auto">
  <rect width="680" height="320" fill="#090d16" rx="12"/>
  
  <!-- Title -->
  <text x="340" y="28" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">Arquitetura Interna do Linux Epoll: Red-Black Tree &amp; Ready List</text>
  
  <!-- Kernel Space Boundary -->
  <rect x="30" y="45" width="620" height="255" rx="8" fill="#111827" stroke="#334155" stroke-width="1.5"/>
  <text x="50" y="68" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11" font-weight="bold">Linux Kernel Space (Instância epoll)</text>

  <!-- Left: Red-Black Tree (All Registered FDs) -->
  <rect x="50" y="80" width="280" height="205" rx="6" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="190" y="103" fill="#93c5fd" font-family="-apple-system, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Red-Black Tree (epoll_ctl)</text>
  <text x="190" y="118" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="10" text-anchor="middle">Armazena todos os N sockets monitorados</text>

  <!-- RB Tree Nodes Diagram -->
  <circle cx="190" cy="150" r="14" fill="#000000" stroke="#94a3b8" stroke-width="2"/>
  <text x="190" y="154" fill="#ffffff" font-family="-apple-system, monospace" font-size="9" text-anchor="middle">FD 5</text>

  <circle cx="130" cy="195" r="14" fill="#b91c1c" stroke="#f87171" stroke-width="2"/>
  <text x="130" y="199" fill="#ffffff" font-family="-apple-system, monospace" font-size="9" text-anchor="middle">FD 2</text>

  <circle cx="250" cy="195" r="14" fill="#b91c1c" stroke="#f87171" stroke-width="2"/>
  <text x="250" y="199" fill="#ffffff" font-family="-apple-system, monospace" font-size="9" text-anchor="middle">FD 8</text>

  <line x1="180" y1="160" x2="140" y2="185" stroke="#64748b" stroke-width="1.5"/>
  <line x1="200" y1="160" x2="240" y2="185" stroke="#64748b" stroke-width="1.5"/>

  <text x="190" y="245" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Busca, Inserção e Remoção em O(log N)</text>
  <text x="190" y="260" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="9" text-anchor="middle">Não precisa reenviar a lista a cada chamada!</text>

  <!-- Center Arrow: Interrupt / Event Notification -->
  <path d="M 330 180 L 370 180" stroke="#f59e0b" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="350" y="165" fill="#fbbf24" font-family="-apple-system, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">NIC</text>
  <text x="350" y="200" fill="#fbbf24" font-family="-apple-system, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">Event</text>

  <!-- Right: Ready List (Doubly Linked List for Active Events) -->
  <rect x="370" y="80" width="260" height="205" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
  <text x="500" y="103" fill="#6ee7b7" font-family="-apple-system, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Ready List (Fila Duplamente Ligada)</text>
  <text x="500" y="118" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="10" text-anchor="middle">Contém apenas os K sockets com dados</text>

  <!-- Active Event Nodes in Ready List -->
  <rect x="390" y="140" width="220" height="32" rx="4" fill="#065f46" stroke="#10b981"/>
  <text x="500" y="160" fill="#ffffff" font-family="-apple-system, monospace" font-size="10" font-weight="bold" text-anchor="middle">⚡ FD 2 (EPOLLIN: Novos Bytes Chegaram)</text>

  <rect x="390" y="185" width="220" height="32" rx="4" fill="#065f46" stroke="#10b981"/>
  <text x="500" y="205" fill="#ffffff" font-family="-apple-system, monospace" font-size="10" font-weight="bold" text-anchor="middle">⚡ FD 8 (EPOLLOUT: Buffer Livre)</text>

  <text x="500" y="245" fill="#4ade80" font-family="-apple-system, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">epoll_wait() retorna em O(K)</text>
  <text x="500" y="260" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="9" text-anchor="middle">Zero varredura de sockets inativos!</text>
</svg>

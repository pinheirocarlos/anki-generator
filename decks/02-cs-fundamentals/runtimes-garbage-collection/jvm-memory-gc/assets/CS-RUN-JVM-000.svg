<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" width="100%" height="auto">
  <rect width="680" height="300" fill="#090d16" rx="12"/>
  
  <!-- Title -->
  <text x="340" y="28" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">Arquitetura de Memória da JVM (Hipótese Geracional)</text>
  
  <!-- Young Generation Container -->
  <rect x="30" y="55" width="360" height="150" rx="8" fill="#111827" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="210" y="78" fill="#93c5fd" font-family="-apple-system, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Young Generation (Minor GC Frequente)</text>

  <!-- Eden -->
  <rect x="45" y="95" width="180" height="95" rx="6" fill="#1e3a8a"/>
  <text x="135" y="130" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Eden Space</text>
  <text x="135" y="150" fill="#93c5fd" font-family="-apple-system, sans-serif" font-size="10" text-anchor="middle">Todos 'new Objeto()' nascem aqui</text>
  <text x="135" y="170" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="9" text-anchor="middle">(~95% morrem no 1º GC)</text>

  <!-- Survivor Spaces (S0 / S1) -->
  <rect x="235" y="95" width="70" height="95" rx="6" fill="#1e293b" stroke="#0284c7"/>
  <text x="270" y="135" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">S0 (From)</text>
  <text x="270" y="155" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="9" text-anchor="middle">Age: 1..14</text>

  <rect x="310" y="95" width="70" height="95" rx="6" fill="#1e293b" stroke="#0284c7"/>
  <text x="345" y="135" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">S1 (To)</text>
  <text x="345" y="155" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="9" text-anchor="middle">Alterna GC</text>

  <!-- Old Generation Container -->
  <rect x="410" y="55" width="240" height="150" rx="8" fill="#111827" stroke="#eab308" stroke-width="1.5"/>
  <text x="530" y="78" fill="#fde047" font-family="-apple-system, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Old Generation (Tenured)</text>

  <rect x="425" y="95" width="210" height="95" rx="6" fill="#713f12"/>
  <text x="530" y="135" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Tenured Space</text>
  <text x="530" y="155" fill="#fef08a" font-family="-apple-system, sans-serif" font-size="10" text-anchor="middle">Singletons, Caches, Pools</text>
  <text x="530" y="172" fill="#fde047" font-family="-apple-system, sans-serif" font-size="9" text-anchor="middle">(Major / Full GC raro)</text>

  <!-- Promotion Arrow -->
  <path d="M 380 142 L 420 142" stroke="#22c55e" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="400" y="130" fill="#4ade80" font-family="-apple-system, sans-serif" font-size="8" font-weight="bold" text-anchor="middle">Age ≥ 15</text>

  <!-- Metaspace (Non-Heap) -->
  <rect x="30" y="220" width="620" height="55" rx="8" fill="#1e293b" stroke="#64748b"/>
  <text x="340" y="243" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Metaspace (Memória Nativa Off-Heap / Não Gerenciada pelo GC)</text>
  <text x="340" y="260" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10" text-anchor="middle">Metadados de Classes Carregadas, Bytecode, Constant Pool (Substituiu o PermGen no Java 8+)</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" width="100%" height="auto">
  <rect width="680" height="320" fill="#090d16" rx="12"/>
  
  <!-- Title -->
  <text x="340" y="28" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">Evolução dos Protocolos Web: HTTP/1.1 vs HTTP/2 vs HTTP/3 (QUIC)</text>
  
  <!-- Column 1: HTTP/1.1 -->
  <rect x="30" y="50" width="195" height="240" rx="8" fill="#111827" stroke="#ef4444" stroke-width="1.5"/>
  <text x="127" y="75" fill="#f87171" font-family="-apple-system, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">HTTP/1.1 (1997)</text>
  <text x="127" y="93" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10" text-anchor="middle">Múltiplos TCPs Seriais</text>
  
  <rect x="45" y="110" width="165" height="28" rx="4" fill="#1e293b" stroke="#64748b"/>
  <text x="127" y="128" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="10" text-anchor="middle">TCP 1: Req 1 ➔ Resp 1</text>
  <rect x="45" y="145" width="165" height="28" rx="4" fill="#1e293b" stroke="#64748b"/>
  <text x="127" y="163" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="10" text-anchor="middle">TCP 2: Req 2 ➔ Resp 2</text>
  <rect x="45" y="180" width="165" height="28" rx="4" fill="#1e293b" stroke="#64748b"/>
  <text x="127" y="198" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="10" text-anchor="middle">TCP 3: Req 3 ➔ Resp 3</text>

  <text x="127" y="240" fill="#fca5a5" font-family="-apple-system, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">⚠️ Head-of-Line Blocking</text>
  <text x="127" y="255" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="9" text-anchor="middle">na camada de aplicação</text>

  <!-- Column 2: HTTP/2 -->
  <rect x="242" y="50" width="195" height="240" rx="8" fill="#111827" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="339" y="75" fill="#93c5fd" font-family="-apple-system, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">HTTP/2 (2015)</text>
  <text x="339" y="93" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10" text-anchor="middle">1 Única Conexão TCP</text>

  <rect x="257" y="110" width="165" height="98" rx="4" fill="#1e3a8a" stroke="#3b82f6"/>
  <text x="339" y="130" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Multiplexing Binário</text>
  <text x="339" y="150" fill="#93c5fd" font-family="-apple-system, monospace" font-size="9" text-anchor="middle">[Stream 1: Frame A]</text>
  <text x="339" y="168" fill="#93c5fd" font-family="-apple-system, monospace" font-size="9" text-anchor="middle">[Stream 2: Frame B]</text>
  <text x="339" y="186" fill="#93c5fd" font-family="-apple-system, monospace" font-size="9" text-anchor="middle">[Stream 3: Frame C]</text>

  <text x="339" y="240" fill="#fde047" font-family="-apple-system, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">⚠️ Perda de Pacote TCP</text>
  <text x="339" y="255" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="9" text-anchor="middle">trava todos os streams</text>

  <!-- Column 3: HTTP/3 (QUIC) -->
  <rect x="455" y="50" width="195" height="240" rx="8" fill="#111827" stroke="#10b981" stroke-width="1.5"/>
  <text x="552" y="75" fill="#6ee7b7" font-family="-apple-system, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">HTTP/3 (QUIC / UDP)</text>
  <text x="552" y="93" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10" text-anchor="middle">Streams 100% Isolados</text>

  <rect x="470" y="110" width="165" height="28" rx="4" fill="#065f46" stroke="#10b981"/>
  <text x="552" y="128" fill="#a7f3d0" font-family="-apple-system, sans-serif" font-size="9" text-anchor="middle">QUIC Stream 1 (UDP)</text>
  <rect x="470" y="145" width="165" height="28" rx="4" fill="#065f46" stroke="#10b981"/>
  <text x="552" y="163" fill="#a7f3d0" font-family="-apple-system, sans-serif" font-size="9" text-anchor="middle">QUIC Stream 2 (UDP)</text>
  <rect x="470" y="180" width="165" height="28" rx="4" fill="#065f46" stroke="#10b981"/>
  <text x="552" y="198" fill="#a7f3d0" font-family="-apple-system, sans-serif" font-size="9" text-anchor="middle">QUIC Stream 3 (UDP)</text>

  <text x="552" y="240" fill="#4ade80" font-family="-apple-system, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">✅ Zero HoL Blocking</text>
  <text x="552" y="255" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="9" text-anchor="middle">1 stream cai, 99 continuam</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 240" width="100%" height="auto">
  <rect width="600" height="240" fill="#0f172a" rx="12"/>
  
  <!-- Title -->
  <text x="300" y="30" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">CPU Cache Line (64 Bytes) &amp; False Sharing</text>
  
  <!-- Core 1 -->
  <rect x="40" y="55" width="230" height="60" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
  <text x="155" y="80" fill="#93c5fd" font-family="-apple-system, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">CPU Core 1 (Thread A)</text>
  <text x="155" y="100" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="11" text-anchor="middle">Modifica varA (Bytes 0..7)</text>

  <!-- Core 2 -->
  <rect x="330" y="55" width="230" height="60" rx="8" fill="#1e293b" stroke="#ef4444" stroke-width="2"/>
  <text x="445" y="80" fill="#fca5a5" font-family="-apple-system, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">CPU Core 2 (Thread B)</text>
  <text x="445" y="100" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="11" text-anchor="middle">Modifica varB (Bytes 8..15)</text>

  <!-- Cache Line Block -->
  <rect x="40" y="145" width="520" height="70" rx="8" fill="#1e293b" stroke="#64748b" stroke-width="1.5"/>
  <text x="300" y="165" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Mesma Cache Line Compartilhada de 64 Bytes (L1/L2 Cache)</text>

  <!-- varA block -->
  <rect x="60" y="175" width="90" height="30" rx="4" fill="#1d4ed8"/>
  <text x="105" y="194" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">varA (8B)</text>

  <!-- varB block -->
  <rect x="160" y="175" width="90" height="30" rx="4" fill="#b91c1c"/>
  <text x="205" y="194" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">varB (8B)</text>

  <!-- Unused / Padding bytes -->
  <rect x="260" y="175" width="280" height="30" rx="4" fill="#334155" stroke="#475569" stroke-dasharray="4"/>
  <text x="400" y="194" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11" text-anchor="middle">Bytes Restantes / Padding (48 Bytes)</text>

  <!-- Arrows -->
  <path d="M 155 115 L 105 170" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 445 115 L 205 170" stroke="#f87171" stroke-width="2" marker-end="url(#arrow)"/>
</svg>

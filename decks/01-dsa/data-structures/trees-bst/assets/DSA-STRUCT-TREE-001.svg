<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 310" width="100%" height="auto">
  <rect width="680" height="310" fill="#090d16" rx="12"/>
  
  <!-- Title -->
  <text x="340" y="28" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">Árvores Auto-Balanceadas: Rotação Simples à Direita em AVL</text>
  
  <!-- Left Side: Unbalanced (Left-Left Case) -->
  <rect x="30" y="50" width="280" height="230" rx="8" fill="#111827" stroke="#ef4444" stroke-width="1.5"/>
  <text x="170" y="75" fill="#f87171" font-family="-apple-system, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Desbalanceada (Caso Left-Left, BF = +2)</text>

  <!-- Node Y (Root) -->
  <circle cx="210" cy="110" r="18" fill="#b91c1c" stroke="#f87171" stroke-width="2"/>
  <text x="210" y="115" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Y</text>

  <!-- Node X (Left child) -->
  <circle cx="140" cy="170" r="18" fill="#1e3a8a" stroke="#3b82f6" stroke-width="2"/>
  <text x="140" y="175" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">X</text>

  <!-- Node T3 (Right child of Y) -->
  <rect x="235" y="155" width="30" height="25" rx="4" fill="#1e293b" stroke="#64748b"/>
  <text x="250" y="172" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10" text-anchor="middle">T3</text>

  <!-- Subtree T1 & T2 -->
  <rect x="90" y="215" width="30" height="25" rx="4" fill="#047857" stroke="#10b981"/>
  <text x="105" y="232" fill="#6ee7b7" font-family="-apple-system, sans-serif" font-size="10" text-anchor="middle">T1</text>

  <rect x="155" y="215" width="30" height="25" rx="4" fill="#1e293b" stroke="#64748b"/>
  <text x="170" y="232" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10" text-anchor="middle">T2</text>

  <!-- Connecting Lines (Left) -->
  <line x1="195" y1="122" x2="155" y2="155" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="225" y1="122" x2="245" y2="155" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="128" y1="185" x2="110" y2="215" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="152" y1="185" x2="165" y2="215" stroke="#94a3b8" stroke-width="1.5"/>

  <!-- Center Arrow -->
  <path d="M 325 160 L 355 160" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="340" y="145" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Rotate</text>
  <text x="340" y="180" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Right</text>

  <!-- Right Side: Balanced after Rotate Right -->
  <rect x="370" y="50" width="280" height="230" rx="8" fill="#111827" stroke="#22c55e" stroke-width="1.5"/>
  <text x="510" y="75" fill="#4ade80" font-family="-apple-system, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Balanceada (Altura O(log N), BF = 0)</text>

  <!-- Node X (New Root) -->
  <circle cx="510" cy="110" r="18" fill="#1e3a8a" stroke="#3b82f6" stroke-width="2"/>
  <text x="510" y="115" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">X</text>

  <!-- Node T1 (Left child of X) -->
  <rect x="430" y="155" width="30" height="25" rx="4" fill="#047857" stroke="#10b981"/>
  <text x="445" y="172" fill="#6ee7b7" font-family="-apple-system, sans-serif" font-size="10" text-anchor="middle">T1</text>

  <!-- Node Y (Right child of X) -->
  <circle cx="575" cy="170" r="18" fill="#b91c1c" stroke="#f87171" stroke-width="2"/>
  <text x="575" y="175" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Y</text>

  <!-- Subtrees under Y -->
  <rect x="535" y="215" width="30" height="25" rx="4" fill="#1e293b" stroke="#64748b"/>
  <text x="550" y="232" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10" text-anchor="middle">T2</text>

  <rect x="600" y="215" width="30" height="25" rx="4" fill="#1e293b" stroke="#64748b"/>
  <text x="615" y="232" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10" text-anchor="middle">T3</text>

  <!-- Connecting Lines (Right) -->
  <line x1="495" y1="122" x2="455" y2="155" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="525" y1="122" x2="565" y2="155" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="565" y1="185" x2="550" y2="215" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="585" y1="185" x2="610" y2="215" stroke="#94a3b8" stroke-width="1.5"/>
</svg>
